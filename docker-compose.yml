services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in your .env file to a Postgres connection string — e.g. a free instance from neon.tech or supabase.com}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in your .env file — generate with: openssl rand -base64 32}"
    restart: unless-stopped
